name: new_flutter_project
description: "Drivey Admin — Car Wash booking platform operator app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Riverpod)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Routing
  go_router: ^14.6.2

  # Typography
  google_fonts: ^8.1.0

  # Local storage / caching (wired in the API-integration phase)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  synchronized: ^3.3.0+3
  flutter_secure_storage: ^9.2.2

  # Networking (wired in the API-integration phase)
  connectivity_plus: ^6.1.0
  http: ^1.1.0
  dio: ^5.3.1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.4

  # Media picker (document & payment-proof uploads — API-integration phase)
  image_picker: ^1.1.2

  # Report CSV export (download bytes → temp file → share sheet)
  path_provider: ^2.1.4
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Launcher-icon generator (run: dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.3

# Launcher icons are generated from assets/images/app_icon.png (a 1024×1024 PNG
# export of assets/images/Logo Admin JPEG.jpg.jpeg). The adaptive foreground is the
# same full-bleed artwork — the generated ic_launcher.xml already insets it by 16%,
# which keeps the logo inside the launcher's circular/squircle mask.
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#F7CD55"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#F7CD55"
    theme_color: "#F7CD55"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
